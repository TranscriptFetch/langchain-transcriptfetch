[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-transcriptfetch"
version = "0.1.0"
description = "LangChain document loader for TranscriptFetch: transcripts of YouTube, TikTok and Instagram videos, whole channels, playlists and searches, chunked for RAG with timestamped citations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "TranscriptFetch", email = "support@transcriptfetch.com" }]
keywords = ["langchain", "document-loader", "youtube", "tiktok", "instagram", "transcript", "rag"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Text Processing",
]
dependencies = ["langchain-core>=0.3.0", "transcriptfetch-sdk>=2.5.0"]

[project.optional-dependencies]
test = ["pytest>=7", "respx>=0.20"]

[project.urls]
Homepage = "https://transcriptfetch.com"
Documentation = "https://transcriptfetch.com/docs"
Source = "https://github.com/TranscriptFetch/langchain-transcriptfetch"

[tool.hatch.build.targets.wheel]
packages = ["langchain_transcriptfetch"]

[tool.ruff]
line-length = 100
target-version = "py310"
